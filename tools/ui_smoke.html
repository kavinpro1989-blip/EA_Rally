<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[engine smoke] EA Rally - 3D Viewport, Stage Planner & Garage Tuning Studio</title>
  <link rel="stylesheet" href="/ui_and_integration/styles/main.css">
  <link rel="stylesheet" href="/ui_and_integration/styles/viewport.css">
  <link rel="stylesheet" href="/ui_and_integration/styles/stage_picker.css">
  <link rel="stylesheet" href="/ui_and_integration/styles/garage.css">
  <link rel="stylesheet" href="/ui_and_integration/styles/hud.css">
</head>
<body>
  <div id="appRoot">
    <!-- Top Navigation Bar -->
    <header class="rally-topbar">
      <div class="brand-section">
        <div class="brand-logo-text">
          <span>EA RALLY</span>
          <span class="badge-wrc">WRC SPEC</span>
        </div>
      </div>

      <!-- Mode Switcher Tabs -->
      <nav class="mode-nav-tabs">
        <button class="nav-tab-btn active" data-tab="stage_drive">
          <span>🏎️ Stage Drive</span>
        </button>
        <button class="nav-tab-btn" data-tab="garage_studio">
          <span>🔧 3D Garage Studio</span>
        </button>
        <button class="nav-tab-btn" data-tab="stage_planner">
          <span>📍 Stage Picker & GPS</span>
        </button>
      </nav>

      <div class="topbar-right-controls">
        <button id="btnAudioToggle" class="audio-toggle-btn">
          <span id="audioIcon">🔊</span>
          <span id="audioLabel">AUDIO ACTIVE</span>
        </button>
      </div>
    </header>

    <!-- 1. Three.js 3D Viewport Canvas Container -->
    <main id="viewportContainer" class="viewport-canvas-container">
      <div class="viewport-floating-controls">
        <div class="camera-selector-group">
          <button class="cam-btn active" data-cam="chase">CHASE (C)</button>
          <button class="cam-btn" data-cam="onboard">ONBOARD</button>
          <button class="cam-btn" data-cam="helicopter">HELI DRONE</button>
        </div>
      </div>
    </main>

    <!-- 2. Interactive Google Maps Stage Picker Overlay -->
    <section id="stagePickerMount" class="stage-picker-overlay" style="display: none;"></section>

    <!-- 3. 3D Garage Mechanical Tuning Studio Overlay -->
    <section id="garageStudioMount" class="garage-studio-overlay" style="display: none;"></section>

    <!-- 4. Real-Time Pro Telemetry HUD & AI Co-Driver Overlay -->
    <aside id="telemetryHudMount"></aside>

    <!-- Global Toast Alert -->
    <pre id="smokeStatus" style="position:fixed;left:8px;bottom:8px;z-index:99999;max-width:46vw;max-height:40vh;overflow:auto;margin:0;padding:8px;background:#000c;color:#9f9;font:11px/1.35 monospace;pointer-events:none">engine smoke: starting...</pre>
    <div id="rallyToast" class="rally-toast">
      <span class="toast-title" id="toastTitle">NOTIFICATION</span>
      <span class="toast-msg" id="toastMsg">Ready</span>
    </div>
  </div>

  <script type="module" src="/tools/ui_smoke.js"></script>
</body>
</html>
